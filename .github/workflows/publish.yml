# Publish asb-schema to PyPI when a tag v<version> is pushed.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repository.
# One-time setup by a maintainer, before the first tag from this repository:
#   1. On pypi.org, project asb-schema, add a trusted publisher:
#      owner HolobiomicsLab, repository asb-schema, workflow publish.yml,
#      environment pypi.
#   2. In the GitHub repository settings, create the environment "pypi"
#      (required reviewers make every release a manual approval).
#
# Nothing is uploaded when the tagged commit is not on main, when the tag does
# not equal the version in pyproject.toml, asb_schema.__version__ and
# CITATION.cff, when CHANGELOG.md has no heading for the version, when no
# licence is declared, when the tests fail, or when twine check rejects the
# metadata.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag equals the package version
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = open("src/asb_schema/__init__.py").read()
          module = re.search(r'^__version__ = "([^"]+)"', init, re.M).group(1)
          if not tag == declared == module:
              print(f"::error::tag v{tag}, pyproject {declared}, __version__ {module} must be equal")
              sys.exit(1)
          citation = re.search(r'^version:\s*"?([^"\s]+)"?\s*$', open("CITATION.cff").read(), re.M)
          if citation is None or citation.group(1) != tag:
              found = citation.group(1) if citation else "none"
              print(f"::error::CITATION.cff version {found} must equal the tag v{tag}")
              sys.exit(1)
          if not re.search(rf"^## {re.escape(tag)}(\s|$)", open("CHANGELOG.md").read(), re.M):
              print(f"::error::CHANGELOG.md has no '## {tag}' heading")
              sys.exit(1)
          PY
      - name: Licence is declared
        run: |
          python - <<'PY'
          import sys, tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          if not (project.get("license") or project.get("license-files")):
              print("::error::pyproject.toml declares no licence; refusing to publish")
              sys.exit(1)
          PY
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: asb-schema-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/asb-schema/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: asb-schema-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
