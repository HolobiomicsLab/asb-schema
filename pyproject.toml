[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asb-schema"
version = "0.4.0"
description = "ASB Schema: LinkML schemas for task cards, capsules, skill bundles and skill collections"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  {name = "Louis-Félix Nothias"}
]
keywords = [
    "LinkML",
    "JSON Schema",
    "JSON-LD",
    "RO-Crate",
    "scientific workflows",
    "research reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The generated files are produced with the exact versions in
# constraints/generate.txt; the runtime range is open.
dependencies = [
    "linkml>=1.7",
    "linkml-runtime>=1.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["mkdocs-material==9.7.6"]

[project.urls]
Homepage = "https://holobiomicslab.github.io/asb-schema/"
Repository = "https://github.com/HolobiomicsLab/asb-schema"
Changelog = "https://github.com/HolobiomicsLab/asb-schema/blob/main/CHANGELOG.md"
Issues = "https://github.com/HolobiomicsLab/asb-schema/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asb_schema = ["*.yaml", "*.schema.json", "*.owl.ttl", "*.jsonld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
